<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Help Desk</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/a2e0e6f91e.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="login-box">
    <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
    <form id="loginForm">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" required autofocus/>
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required />
      </div>
      <button class="btn-shine">Login</button>
      <p class="error" id="errorMsg"></p>
      <p>Not registered? <a href="register.html">Create an account</a></p>
    </form>
  </div>
  <script src="./js/login.js"></script>
</body>
</html>
