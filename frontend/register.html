<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Help Desk</title>
   <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/a2e0e6f91e.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="login-box">
    <h2><i class="fas fa-user-plus"></i> Register</h2>
    <form id="registerForm">
      <div class="input-group">
        <i class="fas fa-id-badge"></i>
        <input type="text" id="name" placeholder="Full Name" required  autofocus/>
      </div>
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Username" required />
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Password" required />
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      </div>
      <button type="submit" class="btn-shine">Register</button>
      <p class="error" id="errorMsg"></p>
      <p>Already registered? <a href="login.html">Login here</a></p>
    </form>
  </div>
  <script src="./js/register.js"></script>
</body>
</html>
