<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ticket Details</title>
  <link rel="stylesheet" href="ticket_details.css" />
</head>
<body>
  <div class="ticket-container">
    <h2>Ticket Details</h2>
    <hr>
    <div class="field"><span class="label">Ticket No:</span> <span class="value" id="ticketid"></span></div>
    <div class="field"><span class="label">Ticket Name:</span> <span class="value" id="ticketName"></span></div>
    <div class="field"><span class="label">Priority:</span> <span class="value" id="priority"></span></div>
    <div class="field"><span class="label">Title:</span> <span class="value" id="title"></span></div>
    <div class="field"><span class="label">Department:</span> <span class="value" id="department"></span></div>
    <div class="field"><span class="label">Description:</span> <span class="value" id="description"></span></div>
    <div class="field"><span class="label">Customer Name:</span> <span class="value" id="customerName"></span></div>
    <div class="field"><span class="label">Email:</span> <span class="value" id="email"></span></div>
    <div class="field"><span class="label">Status:</span> <span class="value" id="status"></span></div>
    <div class="field attachment"><span class="label">Attachment:</span> <span class="value" id="attachment"></span></div>
    <button type="button" onclick= backtohome() class="back-btn">← Back to My Tickets</button>
  </div>

  <script src="./js/ticket_details.js"></script>
</body>
</html>
